name: Generate contribution graph

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contrib-light.svg?color_snake=#18181b&color_dots=#f4f4f5,#d4d4d8,#a1a1aa,#71717a,#3f3f46
            dist/contrib-dark.svg?palette=github-dark&color_snake=#e6edf3&color_dots=#161b22,#30363d,#484f58,#8b949e,#c9d1d9

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
